[project]
name = "ai-eng-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LEVEIER", email = "daiyunpeng017@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
ai-eng-lab = "ai_eng_lab:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--cov=ai_eng_lab --cov-report=term-missing"
